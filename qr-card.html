<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Pablo's Party QR</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;font-family:'Patrick Hand',cursive;
  print-color-adjust:exact;-webkit-print-color-adjust:exact;
}
.card{
  width:320px;
  background:linear-gradient(160deg,#6B21A8 0%,#1A0B3D 100%);
  border-radius:24px;
  padding:28px 24px 28px 24px;
  text-align:center;
  box-shadow:0 8px 40px rgba(0,0,0,.25);
  color:#fff;
  overflow:hidden;
}
.title{
  font-family:'Bangers',cursive;
  font-size:2rem;
  letter-spacing:2px;
  color:#FFD700;
  text-shadow:2px 2px 0 #000;
  line-height:1;
  margin-bottom:4px;
}
.subtitle{font-size:0.9rem;opacity:.8;margin-bottom:0;}

/* characters peek above the QR */
.peek-wrap{
  position:relative;
  margin-top:14px;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}
.peek-img{
  width:100%;
  display:block;
  position:relative;
  z-index:2;
  margin-bottom:0;
}
.qr-wrap{
  position:relative;
  z-index:1;
  background:#fff;
  border-radius:0 0 14px 14px;
  padding:0 14px 18px 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
}
#qrcode canvas, #qrcode img{display:block;}

@media print{
  body{background:#fff;}
  .card{box-shadow:none;border:2px solid #6B21A8;}
}
</style>
</head>
<body>
<div class="card">
  <div class="title">🎈 PABLO'S 7TH!</div>
  <div class="subtitle">Scan for the surprise! 🤫</div>
  <div class="peek-wrap">
    <img src="peek-characters.png" alt="" class="peek-img"/>
    <div class="qr-wrap">
      <div id="qrcode"></div>
    </div>
  </div>
</div>
<script>
const PARTY_URL = "https://jemietdc.github.io/pablo-party-2026/invitation.html";
new QRCode(document.getElementById("qrcode"), {
  text: PARTY_URL,
  width: 240,
  height: 240,
  colorDark: "#000000",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.H
});
</script>
</body>
</html>
